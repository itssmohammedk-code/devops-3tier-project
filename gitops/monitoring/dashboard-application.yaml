apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-3tier-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/itssmohammedk-code/devops-3tier-project.git
    targetRevision: main
    path: gitops/monitoring/dashboard-config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
